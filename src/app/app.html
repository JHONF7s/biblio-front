<router-outlet>
<!-- Botón flotante en la esquina inferior derecha -->
    <div class="theme-toggle-wrapper">
      <app-button
        variant="primary"
        [pill]="true"
        (clicked)="themeService.toggleTheme()">
        {{ themeService.isDarkMode() ? '☀️ Claro' : '🌙 Oscuro' }}
      </app-button>
    </div>
</router-outlet>
