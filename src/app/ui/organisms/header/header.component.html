
    <header class="header">
      <div class="header__container">
        <!-- Logo / Brand -->
        <a routerLink="/" class="header__brand">
          <div class="header__logo-icon">📚</div>
          <div class="header__brand-text">
            <span class="header__brand-title">BiblioAngular</span>
            <span class="header__brand-subtitle">Atomic Design & Signals</span>
          </div>
        </a>

        <!-- Navigation Actions -->
        <nav class="header__actions">
          <a routerLink="/" class="header__link" routerLinkActive="header__link--active" [routerLinkActiveOptions]="{ exact: true }">
            Catálogo
          </a>

          <!-- Loan Cart Trigger Button -->
          <app-button
            variant="outline"
            size="md"
            (clicked)="onOpenLoans()"
          >
            <span>Mis Préstamos</span>
            <span class="header__badge-count" [class.header__badge-count--active]="loansCount() > 0">
              {{ loansCount() }}
            </span>
          </app-button>
        </nav>
      </div>
    </header>
