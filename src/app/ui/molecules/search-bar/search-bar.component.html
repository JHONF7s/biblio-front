
    <div class="search-bar">
      <div class="search-bar__input">
        <app-input
          [placeholder]="placeholder()"
          [value]="currentTerm()"

      <app-button
        variant="primary"
        size="md"
        (clicked)="onSearchSubmit()"
      >
        Buscar
      </app-button>
    </div>
