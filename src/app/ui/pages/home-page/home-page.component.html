
    <app-main-layout>
      <!-- Hero Header Section -->
      <header class="home-hero">
        <div class="home-hero__content">
          <span class="home-hero__tag">Biblioteca Digital Comunitaria</span>
          <h1 class="home-hero__title">Descubre, aprende y expande tu mente.</h1>
          <p class="home-hero__desc">
            Gestiona préstamos de libros en tiempo real con una interfaz reactiva sin Zone.js construida sobre arquitectura Atomic Design.
          </p>
        </div>

        <!-- Quick Stats Overview (Molecules) -->
        <div class="home-hero__stats">
          <app-stat-chip
            label="Títulos en catálogo"
            [value]="stats().totalTitles"
            variant="neutral"
          />
          <app-stat-chip
            label="Préstamos activos"
            [value]="stats().activeLoans"
            variant="neutral"
          />
          <app-stat-chip
            label="Copias disponibles"
            [value]="stats().totalAvailableCopies"
            variant="neutral"
          />
        </div>
      </header>

      <!-- Filter & Search Toolbar (Molecule & Atoms) -->
      <section class="home-toolbar">
        <div class="home-toolbar__search">
          <app-search-bar
            [initialValue]="searchQuery()"
            (queryChange)="onSearchChange($event)"
            (searchSubmit)="onSearchSubmit($event)"
          />
        </div>

        <!-- Category Pills Bar -->
        <div class="home-toolbar__categories">
          @for (cat of categories(); track cat) {
            <button
              type="button"
              class="cat-chip"
              [class.cat-chip--active]="selectedCategory() === cat"
              (click)="onSelectCategory(cat)"
            >
              {{ cat }}
            </button>
          }
        </div>
      </section>

      <!-- Active Filter Info -->
      <section class="home-results-header">
        <h2 class="home-results-title">
          Libros disponibles
          <span class="home-results-count">({{ books().length }})</span>
        </h2>
      </section>

      <!-- Main Organism: Book Grid -->
      <app-book-grid
        [books]="books()"
        [borrowedIds]="borrowedIds()"
        (borrow)="onBorrowBook($event)"
        (returnBook)="onReturnBook($event)"
        (selectBook)="onViewBookDetail($event)"
        (resetFilters)="onResetFilters()"
      />
    </app-main-layout>
