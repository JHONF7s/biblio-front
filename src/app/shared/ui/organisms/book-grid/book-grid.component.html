
    <div class="book-grid-container">
      @for (book of books(); track book.id) {
        <app-book-card
          [book]="book"
          [isBorrowed]="isBorrowed(book.id)"
          (borrow)="onBorrow($event)"
          (returnBook)="onReturn($event)"
          (viewDetails)="onSelect($event)"
        />
      } @empty {
        <div class="book-grid-empty">
          <div class="book-grid-empty__icon">🔍</div>
          <h3 class="book-grid-empty__title">No se encontraron libros</h3>
          <p class="book-grid-empty__desc">
            Prueba ajustando los términos de búsqueda o cambiando la categoría seleccionada.
          </p>
          <app-button
            variant="outline"
            size="md"
            (clicked)="resetFilters.emit()"
          >
            Restablecer filtros
          </app-button>
        </div>
      }
    </div>
