<a
  class="brand"
  [class.brand--disabled]="enInicio()"
  [class.brand--footer]="variante() === 'footer'"
  [attr.href]="enInicio() ? null : '/'"
  [attr.aria-current]="enInicio() ? 'page' : null"
  [attr.aria-disabled]="enInicio() ? 'true' : null"
  [attr.tabindex]="enInicio() ? -1 : 0"
  [attr.aria-label]="enInicio() ? config.nombre + ' (Página de inicio actual)' : 'Ir al inicio de ' + config.nombre"
  (click)="onClick($event)"
  (keydown)="onKeyDown($event)"
>
  <span class="brand__emblem" aria-hidden="true">
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="32" height="32" rx="8" fill="currentColor" fill-opacity="0.14" />
      <path
        d="M10 11.5C10 10.6716 10.6716 10 11.5 10H16.2C17.4 10 18.4 10.7 18.8 11.7C19.2 10.7 20.2 10 21.4 10H24.5C25.3284 10 26 10.6716 26 11.5V23.5C26 24.3284 25.3284 25 24.5 25H20.8C19.8 25 19.1 25.4 18.8 26C18.5 25.4 17.8 25 16.8 25H11.5C10.6716 25 10 24.3284 10 23.5V11.5Z"
        stroke="currentColor"
        stroke-width="2"
        stroke-linejoin="round"
      />
      <path d="M18 11.5V25.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    </svg>
  </span>
  <span class="brand__text">
    <span class="brand__name">{{ config.nombre }}</span>
    <span class="brand__subtitle">{{ config.subtitulo }}</span>
  </span>
</a>
